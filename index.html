<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>In Memory of Zakk Ziegler</title>
<meta name="description" content="Zakk Ziegler's art, music, and writing.">
<meta name="color-scheme" content="light">
<link rel="icon" href="favicon.ico" sizes="16x16">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="header-right">
    <nav class="site-nav" aria-label="Site pages">
      <a href="index.html" aria-current="page">Home</a>
      <a href="about.html">About</a>
      <a href="obituary.html">Obituary</a>
    </nav>
  </div>
</header>

<div id="view">
<section class="hero">
  <h1 class="hero-name">Zakk Ziegler</h1>
  <p class="hero-subtitle">Porco Dio Art</p>
  <p class="hero-dates">March 10, 1992 &ndash; August 19, 2026</p>
</section>

<div class="nav-row">
  <nav class="type-nav" id="type-nav" aria-label="Filter by section" hidden>
    <!-- populated by script.js: Artwork / Photography / Sculpture /
         Text / Audio / All. Sections with no entries yet just fall
         through to the empty state. -->
  </nav>
  <div class="nav-utility">
    <input class="search-input" id="search-input" type="search" placeholder="Search" aria-label="Search everything on the site">
    <button class="shuffle-btn" id="shuffle-btn" type="button" aria-label="Open a random entry">Random</button>
  </div>
</div>

<nav class="location-nav" id="location-nav" aria-label="Filter by location" hidden>
  <!-- populated by script.js: "All" plus one chip per distinct location —
       only shown within the Artwork section -->
</nav>

<nav class="filters" id="filters" aria-label="Filter by tag">
  <!-- populated by script.js: "All" plus one chip per tag used in the
       active section — hidden while the top-level section is "All" -->
</nav>

<main>
  <section class="gallery" id="gallery" aria-label="Index">
    <!-- populated by script.js from photos.js -->
  </section>

  <p class="empty-state" id="empty-state" hidden>
    Nothing indexed yet.<br>
    Add a file to <code>/images</code>, <code>/audio</code>, or <code>/text</code>, and register it in <code>photos.js</code>.
  </p>
</main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Item view" aria-hidden="true">
  <button class="lightbox-copy-link" id="lightbox-copy-link" type="button" aria-label="Copy link to this item">Copy link</button>
  <button class="lightbox-close" id="lightbox-close" aria-label="Close">&#10005;</button>
  <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous item">&#8592;</button>
  <figure class="lightbox-figure">
    <img id="lightbox-image" src="" alt="">
    <div class="lightbox-text" id="lightbox-text" hidden>
      <button class="plain-text-toggle" id="plain-text-toggle" type="button">Plain text</button>
      <div class="lightbox-text-body" id="lightbox-text-body"></div>
    </div>
    <div class="lightbox-subgallery" id="lightbox-subgallery" hidden></div>
    <figcaption>
      <div class="lightbox-caption-line">
        <span class="lightbox-index" id="lightbox-index"></span>
        <span class="lightbox-title" id="lightbox-title"></span>
        <span class="lightbox-meta" id="lightbox-meta"></span>
      </div>
      <div class="lightbox-specs" id="lightbox-specs"></div>
    </figcaption>
  </figure>
  <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next item">&#8594;</button>
  <p class="lightbox-hint" aria-hidden="true">&larr; &rarr; Navigate &middot; Click Center to Zoom &middot; Esc Close &middot; Swipe on Touch</p>
</div>
</div>

<footer class="site-footer">
  <span>In memory of Zakk Ziegler</span>
  <span class="rule" aria-hidden="true"></span>
  <span id="site-stats"></span>
</footer>

<script src="photos.js"></script>
<script src="script.js"></script>
<script src="stats.js"></script>
<script src="player.js"></script>
<script src="book.js"></script>
<script src="router.js"></script>
</body>
</html>
